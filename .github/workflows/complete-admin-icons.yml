name: Complete TSCMS Admin Icons
on:
  push:
    paths:
      - '.github/workflows/complete-admin-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complete-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode PNG files and make missing 512px assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image
          folder = Path("assets/admin-icons")
          names = ["admin-192.png", "admin-apple-touch-180.png", "favicon-admin-32.png", "favicon-admin-48.png"]
          for name in names:
              target = folder / name
              raw = target.read_bytes()
              if not raw.startswith(b"\x89PNG\r\n\x1a\n"):
                  fixed = base64.b64decode(raw.strip(), validate=True)
                  if not fixed.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise ValueError(name + " does not contain a valid PNG")
                  Image.open(io.BytesIO(fixed)).verify()
                  target.write_bytes(fixed)
                  print("Decoded " + name)
              else:
                  Image.open(target).verify()
                  print("Valid " + name)
          source = Image.open(folder / "admin-192.png").convert("RGB")
          source.resize((512, 512), Image.Resampling.LANCZOS).save(folder / "admin-512.png", optimize=True)
          maskable = Image.new("RGB", (512, 512), (7, 7, 8))
          maskable.paste(source.resize((384, 384), Image.Resampling.LANCZOS), (64, 64))
          maskable.save(folder / "admin-maskable-512.png", optimize=True)
          for name in ("admin-512.png", "admin-maskable-512.png"):
              with Image.open(folder / name) as im:
                  assert im.size == (512, 512) and im.format == "PNG"
              print("Created " + name)
          PY
      - name: Commit icon assets and remove temporary workflow
        run: |
          rm .github/workflows/complete-admin-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/admin-icons/admin-192.png assets/admin-icons/admin-apple-touch-180.png assets/admin-icons/favicon-admin-32.png assets/admin-icons/favicon-admin-48.png assets/admin-icons/admin-512.png assets/admin-icons/admin-maskable-512.png .github/workflows/complete-admin-icons.yml
          git commit -m "Repair TSCMS admin icons and complete 512px Android assets"
          git push
