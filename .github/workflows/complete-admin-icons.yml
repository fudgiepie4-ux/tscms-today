name: Complete TSCMS Admin Icons
on:
  push:
    paths:
      - '.github/workflows/complete-admin-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complete-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate missing 512px PNG icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder = Path("assets/admin-icons")
          source = Image.open(folder / "admin-192.png").convert("RGB")
          source.resize((512, 512), Image.Resampling.LANCZOS).save(folder / "admin-512.png", optimize=True)
          maskable = Image.new("RGB", (512, 512), (7, 7, 8))
          maskable.paste(source.resize((384, 384), Image.Resampling.LANCZOS), (64, 64))
          maskable.save(folder / "admin-maskable-512.png", optimize=True)
          PY
      - name: Commit icon assets and remove temporary workflow
        run: |
          rm .github/workflows/complete-admin-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/admin-icons/admin-512.png assets/admin-icons/admin-maskable-512.png .github/workflows/complete-admin-icons.yml
          git commit -m "Complete missing TSCMS admin 512px icons"
          git push
