name: TSCMS Favorites owner totals — hourly Spark writer

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tscms-favorites-owner-aggregate
  cancel-in-progress: false

jobs:
  count-owner-totals:
    # The schedule exists only once merged to main; review branches are inert.
    if: github.repository == 'fudgiepie4-ux/tscms-today' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Admin SDK (no lifecycle scripts)
        run: npm --prefix favorites-pilot/aggregation install --no-audit --no-fund --no-package-lock --ignore-scripts
      - name: Update only pilotAggregates/favorites
        env:
          TSCMS_FAVORITES_SERVICE_ACCOUNT_JSON: ${{ secrets.TSCMS_FAVORITES_SERVICE_ACCOUNT_JSON }}
        run: node favorites-pilot/aggregation/run-hourly.cjs
