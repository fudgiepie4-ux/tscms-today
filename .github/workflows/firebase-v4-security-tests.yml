name: TSCMS Firebase v4 Security Tests

on:
  push:
    branches:
      - clara/firebase-v4-rules-ci-test
    paths:
      - '.github/workflows/firebase-v4-security-tests.yml'
      - 'firebase-ci/**'

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: firebase-ci

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Run security tests
        run: firebase emulators:exec --project demo-tscms-security --only firestore "npm test"

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-v4-test-results
          path: firebase-ci/test-results.json
          if-no-files-found: warn
