<head>

<body class="tc-listening-room">
<main id="tc-fav-playlist-root" class="tc-room">
  <nav class="tc-room-topline" aria-label="Listening Room navigation">
    <a class="tc-room-back" href="./">← Back to TSCMS</a>
    <span class="tc-room-tag">TSCMS · My Playlist</span>
  </nav>
  <header class="tc-room-masthead">
    <p class="tc-room-kicker">Your own corner of the station</p>
    <h1 class="tc-room-title">The Listening Room</h1>
    <p class="tc-room-subtitle">Pull up a chair. Your favorite songs have a place here.</p>
    <p id="tc-fav-crate-count" class="tc-room-plaque" hidden></p>
  </header>
  <section class="tc-room-crate" aria-label="My saved song crate">
    <div class="tc-room-crate-heading">
      <h2>My Record Crate</h2>
      <p>Saved songs · Ready when you are</p>
    </div>
    <p id="tc-fav-playlist-message" role="status" aria-live="polite">Checking your sign-in…</p>
    <div id="tc-fav-playlist-list"></div>
  </section>
</main>
