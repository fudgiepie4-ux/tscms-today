<title>Admin Engagement Tracker — TSCMS</title>
<!--
  TSCMS Admin Engagement Tracker (admin-only).
  Standalone page: it does NOT touch admin.html, mc.js, site.css or site.js.
  Firestore-backed (2026-11-13): it reads the `adminEngagement`
  collection (one doc per collected day + one `aggregate` doc) with the
  signed-in admin's Firebase Auth session. Read is gated twice: this page
  shows nothing to anyone who is not a signed-in approved admin, and the
  Firestore rules enforce the same (approved admin or owner, email
  verified). No password, no encrypted bundle — the bundle version is
  superseded. Tracker data lives only in Firestore, never in a public file.
  Deploy: place this file next to admin.html and firebase-admin-config.js.
  A link from admin.html is a one-line patch for Clara (see handoff).
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Special+Elite&display=swap');
:root{color-scheme:dark;--ink:#301b11;--coffee:#160e09;--leather:#301b12;--gold:#d49a43;--paper:#f0dbac;--parchment:#f7e7c2;--muted:#775b40;--wine:#5b1815}
*{box-sizing:border-box}
html{min-width:280px}
body{margin:0;min-height:100vh;color:#f5e7c9;font:16px/1.5 "DM Sans",system-ui,sans-serif;background:radial-gradient(circle at 20% 8%,#704123 0%,transparent 27%),repeating-linear-gradient(91deg,#1b110b 0 16px,#27170e 17px 20px,#170e09 21px 45px,#2b1a10 47px 49px,#180e08 50px 86px),#1b110b}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,#0008,transparent 22%,transparent 78%,#0008),radial-gradient(ellipse at 50% 5%,transparent 10%,#0008 120%);z-index:0}
a{color:#ffe0a0}
a:focus-visible{outline:3px solid #ffdb8a;outline-offset:4px}
.eng-wrap{width:min(100%,770px);margin:0 auto;padding:13px clamp(10px,3vw,22px) 60px;position:relative;z-index:1}
.eng-scene{position:relative;isolation:isolate;overflow:hidden;min-height:260px;border:2px solid #6c4727;border-radius:14px 14px 8px 8px;background:radial-gradient(ellipse at 22% 15%,#d4a36355,transparent 35%),linear-gradient(140deg,#4c301d,#2a1a10 45%,#130e0a);box-shadow:0 11px 36px #000b,inset 0 0 30px #080401;display:grid;grid-template-columns:minmax(126px,38%) 1fr;align-items:end;margin-bottom:20px}
.eng-scene:before{content:"";position:absolute;inset:18px 15px;background:repeating-linear-gradient(23deg,transparent 0 24px,#bb90521c 25px 26px),linear-gradient(145deg,#d6b27b40,#a7794033);clip-path:polygon(6% 0,94% 4%,100% 90%,5% 100%);transform:rotate(-2deg);border:1px solid #e8bd7655;z-index:-1}
.eng-sitetop{position:absolute;top:0;left:0;right:0;background:#0e0a08d9;color:#f3dfb7;text-align:center;font:700 clamp(15px,3vw,22px)/1.4 Georgia,serif;letter-spacing:1.4px;padding:10px 6px;border-bottom:2px solid #9b6a35}
.eng-pug{width:100%;max-width:268px;display:block;filter:drop-shadow(5px 8px 7px #0009);align-self:end;z-index:1}
.eng-cover{padding:52px 13px 16px 1px;align-self:center;text-align:center;z-index:2}
.eng-cover .eng-sticker{display:inline-block;transform:rotate(-7deg);font:700 11px/1.1 "Special Elite",Georgia,serif;letter-spacing:1px;color:#6f2119;border:3px solid #6f2119;background:#f4dfb6e8;padding:6px 8px;margin-bottom:10px}
.eng-cover h1{font:700 clamp(24px,4.7vw,40px)/1.07 "Special Elite",Georgia,serif;color:#f8e5b9;text-shadow:2px 3px #170a06,0 3px 12px #000;overflow-wrap:break-word;letter-spacing:.1px;margin:0}
.eng-cover .eng-tag{font:700 11px/1.3 "Special Elite",Georgia,serif;color:#f3c67f;margin-top:11px;letter-spacing:1.3px}
.eng-prints{position:absolute;right:8px;bottom:11px;font-size:22px;letter-spacing:16px;opacity:.4;transform:rotate(-18deg);pointer-events:none}
.eng-gate,.eng-spot,.eng-win,.eng-report-head{position:relative;margin:0 0 17px;border-radius:5px 14px 7px 12px;border:1px solid #b18a51;background:radial-gradient(circle at 98% 98%,#cda36b33,transparent 35%),linear-gradient(137deg,#f9e8c5,#e4c994 100%);color:var(--ink);box-shadow:0 4px 0 #623f27,0 12px 22px #0008,inset 0 0 16px #9c69331a}
.eng-gate:before,.eng-spot:before,.eng-win:before,.eng-report-head:before{content:"";position:absolute;left:50%;top:-8px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7a75a,#862d12 65%,#43180d);box-shadow:1px 3px 3px #0006;z-index:2}
.eng-gate{margin:18px auto;max-width:640px;padding:32px 20px;text-align:center;border:7px solid #49301d;border-radius:18px;background:linear-gradient(160deg,#3b2519,#1a100a);color:#f6ddb0;box-shadow:inset 0 0 0 2px #9e7848,0 8px 25px #000b}
.eng-gate:before{display:none}
.eng-gate h1{font:700 clamp(23px,5vw,33px)/1.15 "Special Elite",Georgia,serif;color:#ffe3a8;margin:0 0 12px}
.eng-gate p{margin:0 0 12px;color:#e6cca0}
.eng-gate a{font-weight:800;text-underline-offset:4px}
.eng-gate .eng-kicker{display:block;color:#d9a75e;letter-spacing:2px;font-size:12px;font-weight:800;margin-bottom:8px}
.eng-err{color:#ffb39c!important;min-height:22px;font-weight:700}
.eng-report-head{padding:22px 20px 20px;transform:rotate(-.15deg)}
.eng-report-head h1{font:700 clamp(24px,5vw,32px)/1.1 "Special Elite",Georgia,serif;color:#411d13;margin:3px 0 8px}
.eng-kicker{font-size:11px;font-weight:800;letter-spacing:2px;color:#71331d}
.eng-meta{font-size:12px;font-weight:700;color:#6c4c36;margin:0 0 8px;overflow-wrap:anywhere}
.eng-note{color:#614932;font-size:13px;line-height:1.45;margin:0}
.eng-spot{padding:23px 19px 21px}
.eng-spot h2{font:700 clamp(21px,4vw,27px)/1.16 "Special Elite",Georgia,serif;color:#511d16;margin:6px 0 16px}
.eng-winner{color:#5b1815;font:700 clamp(24px,5vw,33px)/1.15 Georgia,serif;overflow-wrap:anywhere}
.eng-avg{font-size:15px;font-weight:800;margin:8px 0 16px;color:#48261b}
.eng-spot ol{margin:8px 0 12px;padding-left:25px;font-size:14px}
.eng-spot li{margin-bottom:7px}
.eng-def{border-top:1px dashed #ad8152;padding-top:11px;color:#694b36;font-size:12px;margin:14px 0 0}
.eng-win{padding:19px 16px 17px}
.eng-window-kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.7px;color:#832b1b;border:2px solid #a64d3c;padding:3px 8px;transform:rotate(-2deg);margin-bottom:9px}
.eng-win h2{font:700 clamp(20px,4.5vw,27px)/1.15 "Special Elite",Georgia,serif;color:#422116;margin:0 0 3px}
.eng-sub{color:#75543b;font-size:12px;margin:0 0 13px}
.eng-metric{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#ead1a1;border:1px solid #b6905b;border-radius:7px;box-shadow:inset 0 1px 4px #84512b1c;padding:14px;margin-bottom:15px}
.eng-metric>div:first-child{max-width:55%}
.eng-metric-label{font-size:11px;letter-spacing:1.2px;font-weight:800;color:#6c4731}
.eng-metric-desc{display:block;color:#6e5642;font-size:12px;margin-top:4px}
.eng-metric strong{font:700 clamp(30px,8vw,48px)/1 Georgia,serif;color:#681e18;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.eng-rank-label{font-size:12px;letter-spacing:1px;font-weight:800;text-transform:uppercase;color:#553323;margin:2px 0 8px}
.eng-scroll{overflow-x:auto}
.eng-win table{width:100%;min-width:245px;border-collapse:collapse;font-size:14px;table-layout:fixed}
.eng-win th{text-align:left;color:#724b2f;font-weight:800;font-size:12px;border-bottom:2px solid #9d7345;padding:7px 5px}
.eng-win td{padding:10px 5px;border-bottom:1px dashed #c69e6c;overflow-wrap:anywhere}
.eng-win th:first-child,.eng-win td:first-child{width:34px}
.eng-win th:last-child,.eng-win td.eng-n{text-align:right;width:80px}
.eng-win td.eng-n{font:700 17px/1.25 Georgia,serif;color:#642019;font-variant-numeric:tabular-nums}
.eng-win tr:nth-child(1) td:nth-child(2){font-weight:800}
.eng-zero{margin-top:14px;padding:9px 10px;font-size:13px;border-left:4px solid #a27946;background:#f7e6c277;color:#61432f}
.eng-zero b{color:#451f15}
.eng-empty{text-align:center;padding:27px;color:#593722;font-weight:700;background:var(--paper);border-radius:9px}
.eng-tot{font-size:12px;color:#624b35;margin-top:10px}
.eng-foot{color:#eed5a8;text-align:center;margin-top:25px;font:700 12px/1.6 "Special Elite",Georgia,serif;letter-spacing:1px}
.eng-foot a{color:#f7d38d}
@media(min-width:600px){.eng-scene{min-height:314px}.eng-cover{padding-top:65px}.eng-spot,.eng-win{padding:26px 30px}.eng-report-head{padding:26px 30px}}
@media(max-width:390px){.eng-scene{grid-template-columns:39% 61%;min-height:232px}.eng-cover{padding:50px 7px 9px 0}.eng-cover h1{font-size:clamp(18px,6vw,25px)}.eng-sticker{font-size:9px!important}.eng-tag{font-size:9px!important}.eng-wrap{padding-left:10px;padding-right:10px}.eng-metric{padding:12px 10px}.eng-win{padding:17px 12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.eng-wrap{max-width:710px;padding:0 10px 42px}

.eng-art-menu{position:absolute;right:1%;top:0;width:12%;height:16%;border-radius:9px;cursor:pointer;min-width:35px;min-height:32px}

.eng-board-title{font:700 11px/1.3 Georgia,serif;text-transform:uppercase;letter-spacing:2px;color:#ffe5b9;text-align:center;margin:5px 0 12px}
.eng-board-sheet{background:linear-gradient(120deg,#fff0cc,#ebd1a0);padding:5px 13px 7px;box-shadow:inset 0 0 24px #b57a3140,0 4px 7px #0008;clip-path:polygon(0 1%,6% 0,14% 1%,22% 0,30% 1%,39% 0,49% 1%,58% 0,66% 1%,76% 0,85% 1%,94% 0,100% 1%,100% 99%,95% 100%,88% 99%,80% 100%,73% 99%,64% 100%,53% 99%,45% 100%,36% 99%,26% 100%,18% 99%,9% 100%,0 99%)}
.eng-summary-row{display:grid;grid-template-columns:61px minmax(0,1fr);align-items:center;gap:12px;padding:17px 3px;border-bottom:2px solid #cfa975}
.eng-summary-row:last-child{border-bottom:0}
.eng-summary-icon{width:57px;height:60px;display:grid;place-items:center;background:#f1d4a2;color:#683b20;border:1px solid #c29962;box-shadow:2px 3px 6px #61401d55;transform:rotate(-5deg);font-size:30px}
.eng-summary-name{font:700 clamp(17px,4.8vw,24px)/1.15 Georgia,serif;color:#381a12}
.eng-summary-figure{display:block;font:700 clamp(32px,9vw,49px)/1.07 Georgia,serif;color:#59160e;font-variant-numeric:tabular-nums}
.eng-summary-period{font:700 11px/1.3 Georgia,serif;color:#60432f}
.eng-win,.eng-spot{background:radial-gradient(ellipse at 75% 8%,#fff8dfaa 0%,transparent 63%),repeating-linear-gradient(93deg,#0000 0 11px,#9c6d1805 12px 13px),linear-gradient(155deg,#fce7ba,#e4c18b)!important;border:0!important;border-radius:3px!important;box-shadow:0 6px 0 #8f5a32,0 16px 26px #0009,inset 0 0 32px #bd7d3540!important;padding:26px 19px 22px!important;margin:0 0 23px!important;clip-path:polygon(0 1%,6% 0,14% 1%,22% 0,34% 1%,45% 0,57% 1%,67% 0,78% 1%,87% 0,100% 1%,100% 99%,93% 100%,84% 99%,75% 100%,64% 99%,52% 100%,41% 99%,32% 100%,22% 99%,12% 100%,0 99%);}
.eng-win:before,.eng-spot:before{left:50%;top:1px;box-shadow:0 3px 3px #51240a88;background:radial-gradient(circle at 30% 25%,#f7c06a,#a53b1e 60%,#5b2111)}
.eng-win h2,.eng-spot h2{font:700 clamp(20px,5.1vw,29px)/1.16 Georgia,serif;color:#39170f;margin:6px 0 5px}
.eng-window-kicker{font:700 11px/1.2 Georgia,serif;letter-spacing:1.2px;color:#71251a;border:2px solid #aa513a;background:#f5d9a7;padding:5px 8px;transform:rotate(-3deg)}
.eng-sub{color:#67472e;font:13px/1.4 Georgia,serif;margin:0 0 11px}
.eng-rank-label{font:700 14px/1.3 Georgia,serif;color:#492319;letter-spacing:0;margin:13px 0 9px;text-transform:none}
.eng-scroll{overflow-x:auto}
.eng-win table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;font:15px/1.35 Georgia,serif}
.eng-win th{color:#60402b;font:700 13px/1.3 Georgia,serif;border-bottom:2px solid #9a673e;padding:7px 5px}
.eng-win td{border-bottom:1px dashed #be9565;padding:11px 5px;vertical-align:middle;color:#29180f}
.eng-win tr:first-child td:nth-child(2){font-weight:800}
.eng-win td.eng-n{font:700 20px/1.2 Georgia,serif;color:#611c16;text-align:right}
.eng-win th:first-child,.eng-win td:first-child{width:29px}
.eng-win th:last-child,.eng-win td:last-child{width:65px}
.eng-zero{font:13px/1.4 Georgia,serif;border-left:4px solid #94562f;background:#fff2cf88;margin-top:15px;padding:10px}
.eng-tot{margin-top:12px;font:700 13px/1.4 Georgia,serif;color:#5c3926;border-top:1px solid #bb9161;padding-top:11px}
.eng-spot{margin-top:14px!important}
.eng-spot .eng-kicker{font-family:Georgia,serif;color:#87391d}
.eng-spot .eng-winner{font-size:27px}
.eng-spot .eng-def{font-size:12px}
.eng-foot{font-family:Georgia,serif;font-size:13px;color:#ead3ac}
@media(min-width:690px){.eng-art-wrap{margin:0 auto 20px;max-width:710px}.eng-wrap{padding-top:0}.eng-summary-row{grid-template-columns:78px 1fr;padding:18px 12px}.eng-summary-icon{width:64px;height:68px}.eng-win,.eng-spot{padding:29px 35px!important}}
@media(max-width:360px){.eng-board{padding:22px 5px 10px}.eng-summary-row{grid-template-columns:45px 1fr;gap:9px}.eng-summary-icon{width:42px;height:50px;font-size:25px}.eng-win{padding:25px 12px 19px!important}.eng-win th,.eng-win td{font-size:12px}.eng-win td.eng-n{font-size:17px}}
</style>

  <div class="eng-gate" id="eng-gate">
    <span class="eng-kicker">🔒 TSCMS STAFF ACCESS</span><h1>Detective’s desk · Admin only</h1>
    <p id="eng-gate-msg">Admins only. Checking your sign-in…</p>
    <p class="eng-err" id="eng-err" role="status"></p>
  </div>
  <div class="eng-body" id="eng-body" style="display:none"></div>
  <footer class="eng-foot">🐾 Follow the clues · <a href="admin.html" target="_self">Back to Admin Control Room</a></footer>
</div>
<script type="module">
import {initializeApp,getApp,getApps} from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
import {getAuth,onAuthStateChanged,reload,getIdToken} from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';
import {getFirestore,doc,getDocFromServer} from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';
import {tscmsFirebaseConfig} from './firebase-admin-config.js';

const app=getApps().length?getApp():initializeApp(tscmsFirebaseConfig);
const auth=getAuth(app),db=getFirestore(app);

function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// Every date the tracker shows carries its timezone: members are in many
// countries, so a bare date is ambiguous. All counts are bucketed on the
// Central Time day the comment was made (see the note under the heading).
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(iso){
  var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||'');
  if(!m)return iso||'';
  return MON[+m[2]-1]+' '+ +m[3] +', '+m[1]+' (Central Time)';
}
function fmtRange(w){
  if(w.label==='This month'){
    var mm=/^(\d{4})-(\d\d)-/.exec(w.start||'');
    if(mm)return MONTHS[+mm[2]-1]+' '+mm[1]+' (Central Time)';
  }
  if(w.start===w.end)return fmtDate(w.start);
  var a=/^(\d{4})-(\d\d)-(\d\d)$/.exec(w.start||''),b=/^(\d{4})-(\d\d)-(\d\d)$/.exec(w.end||'');
  if(!a||!b)return escHtml(w.label);
  if(a[1]===b[1]&&a[2]===b[2])return MON[+a[2]-1]+' '+ +a[3] +'–'+ +b[3] +', '+a[1]+' (Central Time)';
  if(a[1]===b[1])return MON[+a[2]-1]+' '+ +a[3] +' – '+MON[+b[2]-1]+' '+ +b[3] +', '+a[1]+' (Central Time)';
  return MON[+a[2]-1]+' '+ +a[3] +', '+a[1]+' – '+MON[+b[2]-1]+' '+ +b[3] +', '+b[1]+' (Central Time)';
}
function countStr(v){var n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US'):'—';}
function windowHtml(w,caseNo,periodLabel){
  if(!w)return '<section class="eng-win"><h2>'+periodLabel+'</h2><p class="eng-empty">This reporting window has not been published yet.</p></section>';
  var rows=Array.isArray(w.ranked)?w.ranked.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+escHtml(r.name)+'</td><td class="eng-n">'+countStr(r.comments)+'</td></tr>';
  }).join(''):'';
  var none=Array.isArray(w.no_comments)?w.no_comments:[];
  var zero=none.length?'<div class="eng-zero">No comments: <b>'+none.map(escHtml).join(', ')+'</b></div>':'<div class="eng-zero">Everyone commented.</div>';
  var schedule=caseNo==='02'?' · Wednesday–Tuesday week':'';
  return '<section class="eng-win"><span class="eng-window-kicker">CASE FILE '+caseNo+' · 🐾</span>'+
    '<h2>'+periodLabel+'</h2><p class="eng-sub">'+fmtRange(w)+schedule+' · '+countStr(w.days_of_data)+' day(s) of data collected</p>'+
    '<div class="eng-rank-label">🔎 People tracker — ranked admin comments</div>'+
    '<div class="eng-scroll"><table aria-label="'+periodLabel+' ranked admin comments"><thead><tr><th>#</th><th>Admin</th><th>Comments</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    zero+'<div class="eng-tot">Admin comments: '+countStr(w.admin_total)+' of '+countStr(w.total_comments)+' total comments seen.</div></section>';
}
function summaryCard(title,count,detail,icon){
  return '<div class="eng-summary-row"><div class="eng-summary-icon" aria-hidden="true">'+icon+'</div><div>'+
    '<div class="eng-summary-name">'+title+'</div><strong class="eng-summary-figure">'+countStr(count)+'</strong>'+
    '<div class="eng-summary-period">'+detail+'</div></div></div>';
}
function renderEngagement(e){
  if(!e||!e.day||!e.month)return '<div class="eng-empty">No tracker data collected yet.</div>';
  // "week" is produced by the collector for Wednesday 12:00 AM CT to Tuesday 11:59 PM CT.
  // Do not use the former rolling-7-day window as the week substitute.
  var w=e.week,s=e.spotlight;
  var board='<section class="eng-board" aria-label="Engagement comment totals header"><div class="eng-board-title">📋 Evidence board · Admin comments</div>'+
    '<div class="eng-board-sheet">'+
    summaryCard("Today's Engagement",e.day.admin_total,fmtRange(e.day),'🐾')+
    summaryCard("This Week's Engagement",w?w.admin_total:null,'Wednesday–Tuesday · Central Time','📅')+
    summaryCard("This Month's Engagement",e.month.admin_total,fmtRange(e.month),'🗓️')+
    '</div></section>';
  var spotlight='';
  if(s){
    var finalists=Array.isArray(s.finalists)?s.finalists:[];
    var fin=finalists.map(function(f){return '<li>'+escHtml(f.name)+' — '+countStr(f.total)+' total ('+escHtml(f.average)+' / day)</li>';}).join('');
    spotlight='<section class="eng-spot"><span class="eng-kicker">⭐ MONTHLY CASE HONORS</span><h2>Admin Spotlight — '+escHtml(s.month)+' (Central Time)</h2>'+
      '<div class="eng-winner">'+escHtml(s.winner)+'</div>'+
      '<div class="eng-avg">'+escHtml(s.winner_average)+' comments per day average · '+countStr(s.winner_total)+' total</div>'+
      '<ol>'+fin+'</ol><p class="eng-def">'+escHtml(s.definition)+' Based on '+countStr(s.days_of_data)+' day(s) of data collected so far ('+countStr(s.days_elapsed)+' days elapsed in the month, Central Time).</p></section>';
  }
  return '<section class="eng-report-head"><div class="eng-kicker">🔒 ADMIN ONLY · CENTRAL TIME</div>'+
    '<h1>Tracking the comment footprints</h1>'+
    '<p class="eng-meta">Data as of '+fmtDate(e.latest_date)+' · updated '+escHtml(e.generated)+' · admin-only</p>'+
    '<p class="eng-note">Comments are counted on the Central Time day they were made. The week runs Wednesday through Tuesday. Rankings below show each person for the day, current week, and month as collected days accumulate.</p></section>'+
    board+windowHtml(e.day,'01','Daily Engagement')+
    windowHtml(w,'02','Wednesday Week Engagement')+
    windowHtml(e.month,'03','Monthly Engagement')+spotlight;
}
// Same approved-admin bar as the Firestore rules (promoSignedInAdmin):
// signed in, email verified, approved, admin or owner. The rules are the
// real boundary; this gate only decides what the page shows.
async function approvedAdmin(user){
  if(!user||!user.uid)return false;
  await reload(user);
  await getIdToken(user,true);
  if(auth.currentUser?.uid!==user.uid||user.emailVerified!==true)return false;
  const snap=await getDocFromServer(doc(db,'users',user.uid));
  if(!snap.exists())return false;
  const p=snap.data();
  return p.status==='approved'&&(p.admin===true||p.owner===true);
}
async function loadEngagement(){
  const msg=document.getElementById('eng-gate-msg');
  const err=document.getElementById('eng-err');
  const user=auth.currentUser;
  if(!user){
    msg.innerHTML='Admins only. <a href="admin.html">Sign in on the admin page</a>, then come back here.';
    return;
  }
  msg.textContent='Checking your admin access…';
  let ok=false;
  try{ok=await approvedAdmin(user);}catch(e){ok=false;}
  if(!ok){
    msg.textContent='This page is for TSCMS admins only.';
    err.textContent='Your account is not an approved admin.';
    return;
  }
  msg.textContent='Loading tracker data…';
  let data=null;
  try{
    const snap=await getDocFromServer(doc(db,'adminEngagement','aggregate'));
    if(snap.exists())data=snap.data();
  }catch(e){
    msg.textContent='Tracker data is temporarily unavailable.';
    err.textContent='Check your connection and refresh.';
    return;
  }
  if(!data){
    msg.textContent='No tracker data collected yet.';
    return;
  }
  document.getElementById('eng-gate').style.display='none';
  const body=document.getElementById('eng-body');
  body.style.display='block';
  body.innerHTML=renderEngagement(data);
}
onAuthStateChanged(auth,()=>{void loadEngagement();});
</script>
