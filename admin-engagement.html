<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Engagement Tracker — TSCMS</title>
<!--
  TSCMS Admin Engagement Tracker (admin-only).
  Standalone page: it does NOT touch admin.html, mc.js, site.css or site.js.
  Firestore-backed (2026-11-13): it reads the `adminEngagement`
  collection (one doc per collected day + one `aggregate` doc) with the
  signed-in admin's Firebase Auth session. Read is gated twice: this page
  shows nothing to anyone who is not a signed-in approved admin, and the
  Firestore rules enforce the same (approved admin or owner, email
  verified). No password, no encrypted bundle — the bundle version is
  superseded. Tracker data lives only in Firestore, never in a public file.
  Deploy: place this file next to admin.html and firebase-admin-config.js.
  A link from admin.html is a one-line patch for Clara (see handoff).
-->
<style>
body{margin:0;background:#14100b;color:#f6e6ca;font:15px/1.5 system-ui,sans-serif}
.eng-wrap{max-width:800px;margin:0 auto;padding:20px}
.eng-gate{margin:60px auto;max-width:420px;background:#231a10;border:2px solid #bc975e;border-radius:14px;padding:22px;text-align:center}
.eng-gate h1{font:700 22px/1.3 Georgia,serif;color:#ffd88a;margin:0 0 8px}
.eng-gate p{color:#d9c49a;margin:0 0 14px}
.eng-gate a{color:#ffd88a}
.eng-err{color:#ff9a7a;min-height:22px;margin:10px 0 0;font-weight:700}
.eng-body h1{font:700 24px/1.3 Georgia,serif;color:#ffd88a;margin:0 0 4px}
.eng-meta{color:#d9c49a;margin:0 0 6px}
.eng-note{color:#d9c49a;font-size:13px;margin:0 0 18px}
.eng-spot{margin:0 0 20px;padding:16px;background:#231a10;border:2px solid #bc975e;border-radius:14px}
.eng-spot h2{font:700 19px/1.3 Georgia,serif;color:#ffd88a;margin:0 0 6px}
.eng-spot .eng-winner{font:700 22px/1.3 Georgia,serif;color:#fff}
.eng-spot .eng-avg{font-size:17px;margin:4px 0}
.eng-spot .eng-def{color:#d9c49a;font-size:13px;margin:8px 0 0}
.eng-spot ol{margin:8px 0 0;padding-left:22px}
.eng-win{margin:0 0 20px;padding:16px;background:#231a10;border:1px solid #6b543a;border-radius:14px}
.eng-win h2{font:700 18px/1.3 Georgia,serif;color:#ffd88a;margin:0 0 4px}
.eng-win .eng-sub{color:#d9c49a;font-size:13px;margin:0 0 10px}
.eng-win table{width:100%;border-collapse:collapse}
.eng-win th{text-align:left;color:#d9c49a;font-size:13px;border-bottom:1px solid #6b543a;padding:4px 6px}
.eng-win td{border-bottom:1px solid #3a2d1d;padding:6px}
.eng-win td.eng-n{text-align:right;font-weight:700}
.eng-zero{margin-top:10px;color:#d9c49a}
.eng-zero b{color:#f6e6ca}
.eng-tot{margin-top:10px;color:#ffdd9c}
.eng-empty{color:#d9c49a;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="eng-wrap">
  <div class="eng-gate" id="eng-gate">
    <h1>&#128272; Admin Engagement Tracker</h1>
    <p id="eng-gate-msg">Admins only. Checking your sign-in…</p>
    <p class="eng-err" id="eng-err" role="status"></p>
  </div>
  <div class="eng-body" id="eng-body" style="display:none"></div>
</div>
<script type="module">
import {initializeApp,getApp,getApps} from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
import {getAuth,onAuthStateChanged,reload,getIdToken} from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';
import {getFirestore,doc,getDocFromServer} from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';
import {tscmsFirebaseConfig} from './firebase-admin-config.js';

const app=getApps().length?getApp():initializeApp(tscmsFirebaseConfig);
const auth=getAuth(app),db=getFirestore(app);

function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// Every date the tracker shows carries its timezone: members are in many
// countries, so a bare date is ambiguous. All counts are bucketed on the
// Central Time day the comment was made (see the note under the heading).
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(iso){
  var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||'');
  if(!m)return iso||'';
  return MON[+m[2]-1]+' '+ +m[3] +', '+m[1]+' (Central Time)';
}
function fmtRange(w){
  if(w.label==='This month'){
    var mm=/^(\d{4})-(\d\d)-/.exec(w.start||'');
    if(mm)return MONTHS[+mm[2]-1]+' '+mm[1]+' (Central Time)';
  }
  if(w.start===w.end)return fmtDate(w.start);
  var a=/^(\d{4})-(\d\d)-(\d\d)$/.exec(w.start||''),b=/^(\d{4})-(\d\d)-(\d\d)$/.exec(w.end||'');
  if(!a||!b)return escHtml(w.label);
  if(a[1]===b[1]&&a[2]===b[2])return MON[+a[2]-1]+' '+ +a[3] +'–'+ +b[3] +', '+a[1]+' (Central Time)';
  if(a[1]===b[1])return MON[+a[2]-1]+' '+ +a[3] +' – '+MON[+b[2]-1]+' '+ +b[3] +', '+a[1]+' (Central Time)';
  return MON[+a[2]-1]+' '+ +a[3] +', '+a[1]+' – '+MON[+b[2]-1]+' '+ +b[3] +', '+b[1]+' (Central Time)';
}
function windowHtml(w){
  var rows=w.ranked.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+escHtml(r.name)+'</td><td class="eng-n">'+r.comments+'</td></tr>';
  }).join('');
  var zero=w.no_comments.length
    ? '<div class="eng-zero">No comments: <b>'+w.no_comments.map(escHtml).join(', ')+'</b></div>'
    : '<div class="eng-zero">Everyone commented.</div>';
  return '<section class="eng-win"><h2>'+fmtRange(w)+'</h2>'+
    '<p class="eng-sub">'+w.days_of_data+' day(s) of data collected</p>'+
    '<table><tr><th>#</th><th>Admin</th><th style="text-align:right">Comments</th></tr>'+rows+'</table>'+
    zero+
    '<div class="eng-tot">Admin comments: '+w.admin_total+' of '+w.total_comments+' total comments seen.</div></section>';
}
function renderEngagement(e){
  if(!e||!e.spotlight||!e.day||!e.last_7_days||!e.month){
    return '<div class="eng-empty">No tracker data collected yet.</div>';
  }
  var s=e.spotlight;
  var fin=s.finalists.map(function(f,i){
    return '<li>'+escHtml(f.name)+' — '+f.total+' total ('+f.average+' / day)</li>';
  }).join('');
  var spot='<section class="eng-spot"><h2>&#11088; Admin Spotlight — '+escHtml(s.month)+' (Central Time)</h2>'+
    '<div class="eng-winner">'+escHtml(s.winner)+'</div>'+
    '<div class="eng-avg">'+s.winner_average+' comments per day average &middot; '+s.winner_total+' total</div>'+
    '<ol>'+fin+'</ol>'+
    '<p class="eng-def">'+escHtml(s.definition)+' Based on '+s.days_of_data+' day(s) of data collected so far ('+s.days_elapsed+' days elapsed in the month, Central Time).</p></section>';
  return '<h1>Admin Engagement Tracker</h1>'+
    '<p class="eng-meta">Data as of '+fmtDate(e.latest_date)+' &middot; updated '+escHtml(e.generated)+' &middot; admin-only</p>'+
    '<p class="eng-note">Comments are counted on the Central Time day they were made — so an evening comment from Australia lands on the Central Time day it fell on.</p>'+
    spot+windowHtml(e.day)+windowHtml(e.last_7_days)+windowHtml(e.month);
}
// Same approved-admin bar as the Firestore rules (promoSignedInAdmin):
// signed in, email verified, approved, admin or owner. The rules are the
// real boundary; this gate only decides what the page shows.
async function approvedAdmin(user){
  if(!user||!user.uid)return false;
  await reload(user);
  await getIdToken(user,true);
  if(auth.currentUser?.uid!==user.uid||user.emailVerified!==true)return false;
  const snap=await getDocFromServer(doc(db,'users',user.uid));
  if(!snap.exists())return false;
  const p=snap.data();
  return p.status==='approved'&&(p.admin===true||p.owner===true);
}
async function loadEngagement(){
  const msg=document.getElementById('eng-gate-msg');
  const err=document.getElementById('eng-err');
  const user=auth.currentUser;
  if(!user){
    msg.innerHTML='Admins only. <a href="admin.html">Sign in on the admin page</a>, then come back here.';
    return;
  }
  msg.textContent='Checking your admin access…';
  let ok=false;
  try{ok=await approvedAdmin(user);}catch(e){ok=false;}
  if(!ok){
    msg.textContent='This page is for TSCMS admins only.';
    err.textContent='Your account is not an approved admin.';
    return;
  }
  msg.textContent='Loading tracker data…';
  let data=null;
  try{
    const snap=await getDocFromServer(doc(db,'adminEngagement','aggregate'));
    if(snap.exists())data=snap.data();
  }catch(e){
    msg.textContent='Tracker data is temporarily unavailable.';
    err.textContent='Check your connection and refresh.';
    return;
  }
  if(!data){
    msg.textContent='No tracker data collected yet.';
    return;
  }
  document.getElementById('eng-gate').style.display='none';
  const body=document.getElementById('eng-body');
  body.style.display='block';
  body.innerHTML=renderEngagement(data);
}
onAuthStateChanged(auth,()=>{void loadEngagement();});
</script>
</body>
</html>
